[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lts-physics-surrogate"
version = "0.1.0"
description = "Lightweight Transolver Surrogate with persistent latent physics tokens"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "torch>=2.4",
  "einops>=0.7",
  "jaxtyping>=0.2.28",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
lts-check-protocol = "lts.protocol:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
# Ruff parses jaxtyping's shape strings as forward-reference expressions.
"src/lts/models/light_transolver.py" = ["F722"]
